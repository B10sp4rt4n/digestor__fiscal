name: Fiscal safety (isolated PostgreSQL)

on:
  push:
    branches: [fix/billing-idempotency-mvp]
    paths:
      - app/**
      - tests/**
      - requirements.fiscal-test.txt
      - .github/workflows/fiscal-safety.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fiscal-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fiscal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fiscal_ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: digestor_fiscal_test
        ports: [55433:5432]
        options: >-
          --health-cmd "pg_isready -U fiscal_ci -d digestor_fiscal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Application imports use SQLite; only explicit guarded tests use PG.
      DATABASE_URL: "sqlite:///:memory:"
      DB_SSL_REQUIRE: "false"
      AUTH_CONNECTOR: jwt
      BILLING_TEST_DATABASE_URL: postgresql+psycopg://fiscal_ci:synthetic-ci-only@127.0.0.1:55433/digestor_fiscal_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install minimal fiscal test dependencies (runner Python 3.12)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.fiscal-test.txt
      - name: Unit, offline SOAP, real handlers and two-connection concurrency
        run: >-
          .venv/bin/python -m pytest -q
          tests/test_billing_stamp_guards.py
          tests/test_billing_stamp_integration.py
          tests/test_timbracfdi_response_safety.py
