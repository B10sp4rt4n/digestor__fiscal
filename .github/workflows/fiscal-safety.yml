name: Fiscal safety (isolated PostgreSQL)

on:
  push:
    branches: [feat/professional-prefactura-pdf, feat/prefactura-estimated-folio, fix/invoice-numbering-migration-bootstrap, feat/invoice-numbering, fix/fiscal-correction-integrity, fix/ppd-connected-cycle, feat/invoice-stamp-recovery, fix/billing-idempotency-mvp, feat/fiscal-aup-core, feat/ppd-payment-cycle, feat/fiscal-payment-cancellation, feat/ppd-production-release, feat/fiscal-general-production, fix/fiscal-confirmed-document, feat/csf-local-ocr, fix/cfdi-use-regime-catalog, feat/sat-catalog-search-aup, fix/csf-fast-review, feat/sat-status-evidence]
    paths:
      - app/**
      - tests/**
      - scripts/install_fiscal_cycle.py
      - scripts/run_fiscal_cycle_fixture.py
      - scripts/run_public_pac_pilot.py
      - scripts/run*invoice*recovery*.py
      - migrations/**
      - requirements.fiscal-test.txt
      - railpack.json
      - requirements.txt
      - .github/workflows/fiscal-safety.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fiscal-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fiscal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fiscal_ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: digestor_fiscal_test
        ports: [55433:5432]
        options: >-
          --health-cmd "pg_isready -U fiscal_ci -d digestor_fiscal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Application imports use SQLite; only explicit guarded tests use PG.
      DATABASE_URL: "sqlite:///:memory:"
      DB_SSL_REQUIRE: "false"
      AUTH_CONNECTOR: jwt
      LIVE_CANCEL_TEST_DATABASE_URL: postgresql+psycopg://fiscal_ci:synthetic-ci-only@127.0.0.1:55433/digestor_fiscal_test
      BILLING_TEST_DATABASE_URL: postgresql+psycopg://fiscal_ci:synthetic-ci-only@127.0.0.1:55433/digestor_fiscal_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install local OCR and Spanish models
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng tesseract-ocr-osd fonts-dejavu-core
      - name: Install fiscal and maintenance test dependencies (runner Python 3.12)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --index-url https://pypi.org/simple --only-binary=:all: -r requirements.txt -r requirements.fiscal-test.txt
      - name: Full offline suite, maintenance and two-connection concurrency
        run: .venv/bin/python -m pytest -q tests
      - name: Compile opt-in invoice recovery harnesses (no provider requests)
        run: .venv/bin/python -m py_compile scripts/run_invoice_recovery_fixture.py scripts/run_public_invoice_recovery.py scripts/run_fiscal_cycle_fixture.py scripts/run_public_pac_pilot.py
