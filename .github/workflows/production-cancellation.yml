name: Production cancellation safety
on:
  push:
    branches: [feat/production-cancellation-pilot]
  pull_request:
    paths: [app/services/production_cancellation.py, app/api/routers/production_cancellation_v1.py, tests/test_production_cancellation.py, .github/workflows/production-cancellation.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fiscal_ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: digestor_fiscal_test
        ports: [55433:5432]
        options: >-
          --health-cmd "pg_isready -U fiscal_ci -d digestor_fiscal_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: 'sqlite:///:memory:'
      LIVE_CANCEL_TEST_DATABASE_URL: postgresql+psycopg://fiscal_ci:synthetic-ci-only@127.0.0.1:55433/digestor_fiscal_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_production_cancellation.py
