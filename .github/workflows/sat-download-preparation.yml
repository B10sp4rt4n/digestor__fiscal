name: SAT acquisition preparation
on:
  pull_request:
    paths:
      - scripts/sat_download.py
      - tests/test_sat_download_preparation.py
      - requirements.sat-download.txt
      - .github/workflows/sat-download-preparation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==50.0.0
      - run: python -m unittest discover -s tests -p test_sat_download_preparation.py -v
