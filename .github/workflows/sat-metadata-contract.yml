name: SAT metadata contract (offline)
on:
  push:
    branches: [feat/sat-cima-metadata-contract]
  pull_request:
    paths:
      - app/schemas/sat_metadata.py
      - app/services/sat_metadata_import.py
      - app/services/sat_metadata_test_store.py
      - app/services/sat_metadata_staging.py
      - app/services/sat_metadata_postgres.py
      - app/services/sat_metadata_manifest.py
      - app/services/sat_metadata_outbox.py
      - app/services/sat_metadata_http.py
      - scripts/import_sat_metadata_offline.py
      - tests/test_sat_metadata_contract.py
      - tests/test_sat_metadata_import.py
      - tests/test_sat_metadata_postgres.py
      - tests/test_sat_metadata_manifest.py
      - tests/test_sat_metadata_outbox.py
      - tests/test_sat_metadata_http.py
      - contracts/sat-metadata/**
      - .github/workflows/sat-metadata-contract.yml
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fiscal_ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: sat_metadata_test
        ports: [55439:5432]
        options: >-
          --health-cmd "pg_isready -U fiscal_ci -d sat_metadata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SAT_METADATA_TEST_DSN: postgresql://fiscal_ci:synthetic-ci-only@127.0.0.1:55439/sat_metadata_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned contract dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --index-url https://pypi.org/simple pydantic==2.9.2 pytest==9.0.2 'psycopg[binary]==3.2.13'
      - name: Check contracts and disposable SQLite import without production or network
        run: .venv/bin/python -m pytest -q tests/test_sat_metadata_contract.py tests/test_sat_metadata_import.py tests/test_sat_metadata_postgres.py tests/test_sat_metadata_manifest.py tests/test_sat_metadata_outbox.py tests/test_sat_metadata_http.py
      - name: Verify published schemas and synthetic example match the contract
        run: |
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          from app.schemas.sat_metadata import MetadataBatch, CimaMetadataEnvelope
          from tests.test_sat_metadata_contract import payload, export
          root = Path('contracts/sat-metadata')
          for name, expected in [('normalized-batch.schema.json', MetadataBatch.model_json_schema()), ('cima-envelope.schema.json', CimaMetadataEnvelope.model_json_schema()), ('synthetic-envelope.json', export(payload()))]:
              assert json.loads((root/name).read_text()) == expected, name
          PY
